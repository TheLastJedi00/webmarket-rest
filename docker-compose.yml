services:
    db:
        image: mysql:8
        container_name: webmarket-db
        restart: always
        networks:
            - webmarket-rest
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DB}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            TZ: America/Sao_Paulo
        ports:
            - 3307:3306
        volumes:
            - db_data:/var/lib/mysql

    app:
        build: .
        container_name: webmarket-rest
        restart: always
        networks:
            - webmarket-rest
        ports:
            - 8008:8000
        env_file:
            - ./.env
        command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
        depends_on:
            - db

    migrate:
        build: .
        container_name: webmarket-migrate
        networks:
            - webmarket-rest
        env_file:
            - ./.env
        command: alembic upgrade head
        depends_on:
            - db

networks:
    webmarket-rest:
        name: webmarket-rest

volumes:
    db_data:
